version: 2
updates:
  - package-ecosystem: "nuget"
    # Files stored in src/Appium.Net directory
    directory: "/src/Appium.Net" 
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "nuget"
    # Files stored in test/integration directory
    directory: "/test/integration" 
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "test"
      include: "scope"
    ignore:
      # Owned by src/Appium.Net (reached via ProjectReference); bumped by the entry above
      - dependency-name: "Selenium.WebDriver"
      - dependency-name: "System.Drawing.Common"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
