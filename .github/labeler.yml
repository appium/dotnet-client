Enhancement:
  title: '^feat(\([^)]+\))?!?:.*'

BugFix:
  title: '^fix(\([^)]+\))?!?:.*'

Refactor:
  title: '^refactor(\([^)]+\))?!?:.*'

Documentation:
  title: '^docs(\([^)]+\))?!?:.*'

Build:
  title: '^build(\([^)]+\))?!?:.*'

CI:
  title: '^ci(\([^)]+\))?!?:.*'

Test:
  title: '^test(\([^)]+\))?!?:.*'

Chore:
  title: '^chore(\([^)]+\))?!?:.*'

GitHub:
  title: '^github(\([^)]+\))?!?:.*'

WIP:
  title: "^WIP:.*"
  mergeable: false

BreakingChange:
  title: '^[a-z]+(\([^)]+\))?!:.*|^.*BREAKING CHANGE:.*'
  mergeable: false
  
